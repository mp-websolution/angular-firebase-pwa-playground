name: Deploy

# main is only reachable by merging a PR. Deploying a tag by hand ships a release/* branch or rolls back.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

# A newer run replaces one that is still waiting, so an older commit never lands on top of a newer one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Pin the commit, so the checks and the deploy see the same code if the branch or tag moves
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z."
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha) || {
            echo "::error::Could not resolve tag '$TAG' to a commit. Does it exist?"
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  checks:
    needs: resolve-commit
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.resolve-commit.outputs.sha }}

  deploy:
    needs: [resolve-commit, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-commit.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Read the project ID from the committed web config, so the rules reach the project the client uses
        id: project
        run: |
          project_id=$(node --input-type=module --no-warnings -e "
            const { environment } = await import('./src/environments/environment.ts');
            console.log(environment.firebase.options.projectId);
          ")
          if [[ -z "$project_id" || "$project_id" == REPLACE_ME* ]]; then
            echo "::error::src/environments/environment.ts still holds the placeholder web config. Paste the production project's config there."
            exit 1
          fi
          echo "id=$project_id" >> "$GITHUB_OUTPUT"

      - run: npm run build

      - name: Deploy the Firestore and Storage rules first, to fail on a setup mistake before anything reaches the webspace
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ steps.project.outputs.id }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase deploy --only firestore:rules,storage --project "$PROJECT_ID" --non-interactive

      # Plain FTP, knowingly (ADR 0002).
      - name: Upload the app over FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/browser/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
