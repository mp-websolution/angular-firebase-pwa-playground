# No auto-merge: a human merges every update PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Major Angular upgrades need `ng update`'s migrations, so Dependabot leaves them alone.
    # Keep this list in step with the `angular` group below.
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@schematics/angular'
        update-types: ['version-update:semver-major']
      - dependency-name: 'angular-eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-eslint/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # The compiler pins the TypeScript range, and typescript-eslint must support that TypeScript version.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'angular-eslint'
          - '@angular-eslint/*'
          - 'typescript'
          - 'typescript-eslint'
      firebase:
        patterns:
          - 'firebase'
          - 'firebase-tools'
          - '@firebase/*'
      # Groups are matched in order, so this catch-all must stay last.
      other:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
