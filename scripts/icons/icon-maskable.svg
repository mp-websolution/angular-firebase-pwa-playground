<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon: opaque full-bleed background, artwork scaled into the central safe zone
       (a circle of radius 40%), so any mask shape the platform applies keeps it whole. -->
  <rect width="512" height="512" fill="#0f172a"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <rect x="196" y="128" width="120" height="120" rx="16" fill="#ffffff"/>
    <rect x="128" y="264" width="120" height="120" rx="16" fill="#f59e0b"/>
    <rect x="264" y="264" width="120" height="120" rx="16" fill="#38bdf8"/>
  </g>
</svg>
